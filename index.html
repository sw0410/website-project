<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- [세트 2] viewport: 이 줄이 있어야 모바일에서 폭 기준 @media가 제대로 동작한다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 포트폴리오</title>
<style>
    /* [세트 5 / 평가 2-3] CSS 변수: 색을 :root에 한 번만 정의하고 var(--이름)으로 가져다 쓴다.
       바꿀 때 이 한 곳만 고치면 사용하는 모든 곳이 함께 바뀐다. */
    :root {
      --text: #333333;
      --bg: #ffffff;
      --bg-alt: #f0f4f8;
      --font-main: sans-serif;
      --font-heading: serif;
    }
    h1, h2 { font-family: var(--font-heading); }
    /* [세트 5 / 평가 3-1] 화면 업데이트: html에 dark 이름표가 붙으면 변수 값이 바뀌고,
       var(--...)를 쓰는 모든 곳의 색이 따라 바뀐다. 이 블록이 없으면 이름표만 붙고 화면은 그대로다. */
    :root.dark {
      --text: #eeeeee;
      --bg: #111111;
      --bg-alt: #1c1c1c;
    }
    /*기본 리셋: 여백 제거 및 박스 크기 기준 설정*/
    /* [주의] CSS 주석은 처음 만나는 별표+슬래시에서 끝난다. 닫지 않으면 아래 규칙이 전부 삼켜진다. (세트 5에서 겪음) */
    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    /* [세트 5] body에 color를 지정하면 자식 요소가 상속받는다. 단, 자기 color가 있는 요소(footer 등)는 따르지 않는다. */
    body {
      font-family: var(--font-main);
      line-height: 1.6;
      color: var(--text);
    }
    /* 6개 섹션이 눈에 잘 보이도록 색상과 여백 부여 */
    header, section, footer {
      padding: 60px 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    #hero { background-color: var(--bg-alt); }
    #about { background-color: var(--bg); }
    #skills { background-color: var(--bg-alt); }
    #projects { background-color: var(--bg); }
    #contact { background-color: var(--bg-alt); }
    footer { background-color: #333333; color: #ffffff; }

    /* [세트 3] 햄버거 버튼: 기본은 숨기고(display: none) 좁은 화면에서만 보이게 한다.
       color를 지정하지 않으면 버튼은 body 색을 상속받지 않아서 다크 모드에서 안 보였다. (세트 5) */
    #menu-btn {
    display: none;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--text); 
    }

    /* [세트 1 / 평가 3-4] 링크를 가로 한 줄로 늘어놓기: Flexbox는 한 방향 배치에 쓴다. gap은 아이템 사이 간격이다. */
    #menu-links {
      display: flex;
      gap: 20px;
    }
    /* [세트 1] sticky는 부모 상자 안에서만 따라다닌다. 그래서 nav는 header 안이 아니라 body 바로 아래에 둔다. */
    nav {
      background: var(--bg);
      padding: 16px;
      position: sticky;
      top: 0;
    }
    /* [세트 4] 스크롤 등장 애니메이션: 처음엔 투명하고 아래에 있다가 visible이 붙으면 서서히 나타난다. */
    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s, transform 0.6s;
  }

  .reveal.visible {
    opacity: 1;
    transform: none;
  }
    
    /* [세트 2 / 평가 4-2] 반응형: 폭이 600px 이하일 때만 아래 규칙이 덧씌워진다. (지금은 max-width 방식, 나중에 모바일 퍼스트로 바꿀 예정) */
    @media (max-width: 600px)
    {
      nav {
        display: flex;
        gap: 12px;
        background: var(--bg);
        padding: 12px;
        position: sticky;
        top: 0;
        flex-direction: column;
      }
      header, section, footer{
        padding: 32px 16px;
      }
      header h1 {
        font-size: 1.4rem; 
      }
      #menu-btn { display: block; }


      /* [세트 3] 메뉴는 기본으로 숨기고, JS가 open 이름표를 붙이면 보이게 한다. */
      #menu-links {
        display: none;
        flex-direction: column;
        gap: 12px;
      }
      #menu-links.open { display: flex; }  
      
    }
    /* [세트 1] 링크(#id)를 누르면 부드럽게 스크롤 */
    html { scroll-behavior: smooth; }
    /* section { min-height: 100vh; } */
  
    
  </style>
</head>
<body>

  <!-- [세트 1 / 평가 2-2] 의미 있는 태그: nav는 메뉴, header는 머리말, section은 주제별 구역, footer는 바닥글.
       태그 이름만 보고 역할을 알 수 있어서 읽기 쉽고 접근성에도 좋다. -->
  <nav>
    <button id="menu-btn" aria-label="메뉴 열기">☰</button>
    <div id="menu-links">
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
      <button id="theme-btn" aria-label="다크 모드 전환">🌙</button>
    </div>
  </nav>

  <!-- 1. Hero 섹션: 사이트의 첫인상 -->
  <header id="hero">
    <h1>안녕하세요, 웹 개발자 포트폴리오입니다</h1>
    <p>매일 성장의 씨앗을 키워가는 개발자입니다.</p>
  </header>

  <!-- 2. About 섹션: 자기소개 (class reveal은 스크롤 등장 애니메이션 대상 표시) -->
  <section id="about" class="reveal">
    <h2>About Me</h2>
    <p>배움을 실천하는 개발자입니다.</p>
  </section>

  <!-- 3. Skills 섹션: 기술 스택 -->
  <section id="skills" class="reveal">
    <h2>Skills</h2>
    <p>HTML, CSS, JavaScript</p>
  </section>

  <!-- 4. Projects 섹션: 프로젝트 목록 (추후 GitHub 연동 자리) -->
  <section id="projects" class="reveal">
    <h2>Projects</h2>
    <p>깃허브 저장소 목록이 들어올 자리입니다.</p>
  </section>

  <!-- 5. Contact 섹션: 문의 양식 -->
  <section id="contact" class="reveal">
    <h2>Contact</h2>
    <p>문의사항이 있다면 메시지를 남겨주세요.</p>
  </section>

  <!-- 6. Footer 섹션: 바닥글 -->
  <footer>
    <p>© 2026 내 이름. All rights reserved.</p>
  </footer>

  <script>
    // [세트 3 / 평가 3-1] 이벤트 → 상태 변경 → 화면 업데이트
    // 이벤트: 버튼 클릭 / 상태 변경: open 이름표 붙이기·떼기 / 화면 업데이트: CSS가 이름표를 보고 메뉴를 보이거나 숨김
    const menuBtn = document.getElementById("menu-btn");
    const links = document.getElementById("menu-links");
    menuBtn.addEventListener("click", function () {
      
      links.classList.toggle("open");
    });

    // [세트 4] IntersectionObserver: 요소가 화면에 들어왔는지 지켜보다가 들어오면 visible 이름표를 붙인다.
    // 처음 observe할 때도 한 번 알려주므로 isIntersecting으로 확인한다.
    const targets = document.querySelectorAll(".reveal");
    const observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
        }
      });
    });
    targets.forEach(function (el) {
      observer.observe(el);
    });


    const STATE = { theme: "light", menuOpen: false };

    function render() {
      document.documentElement.classList.toggle("dark", STATE.theme === "dark");
    }
    const themeBtn = document.getElementById("theme-btn");
    themeBtn.addEventListener("click", function () {
      if (STATE.theme === "dark") {
        STATE.theme = "light";
      } else {
        STATE.theme = "dark";
      }
      localStorage.setItem("theme", STATE.theme);
      render();
    });

    if (localStorage.getItem("theme") === "dark") {
      STATE.theme = "dark";
    }
    render(links.classList.toggle("open", STATE.menuOpen));
  </script>
</body>
</html>
