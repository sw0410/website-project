<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 포트폴리오</title>
<style>
    :root {
      --text: #333333;
    }
    /* 기본 리셋: 여백 제거 및 박스 크기 기준 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      line-height: 1.6;
      color: var(--text);
    }
    /* 6개 섹션이 눈에 잘 보이도록 색상과 여백 부여 */
    header, section, footer {
      padding: 60px 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    #hero { background-color: #f0f4f8; }
    #about { background-color: #ffffff; }
    #skills { background-color: #f9f9f9; }
    #projects { background-color: #ffffff; }
    #contact { background-color: #f0f4f8; }
    footer { background-color: #333333; color: #ffffff; }

    #menu-btn {
    display: none;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    }

    #menu-links {
      display: flex;
      gap: 20px;
    }
    nav {
      background: white;
      padding: 16px;
      position: sticky;
      top: 0;
    }
    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s, transform 0.6s;
  }

  .reveal.visible {
    opacity: 1;
    transform: none;
  }
    
    @media (max-width: 600px)
    {
      nav {
        display: flex;
        gap: 12px;
        background: white;
        padding: 12px;
        position: sticky;
        top: 0;
        flex-direction: column;
      }
      header, section, footer{
        padding: 32px 16px;
      }
      header h1 {
        font-size: 1.4rem; 
      }
      #menu-btn { display: block; }

      #menu-links {
        display: none;
        flex-direction: column;
        gap: 12px;
      }
      #menu-links.open { display: flex; }  
      
    }
    html { scroll-behavior: smooth; }
    /* section { min-height: 100vh; } */
  
    
  </style>
</head>
<body>

  <nav>
    <button id="menu-btn" aria-label="메뉴 열기">☰</button>
    <div id="menu-links">
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <!-- 1. Hero 섹션: 사이트의 첫인상 -->
  <header id="hero">
    <h1>안녕하세요, 웹 개발자 포트폴리오입니다</h1>
    <p>매일 성장의 씨앗을 키워가는 개발자입니다.</p>
  </header>

  <!-- 2. About 섹션: 자기소개 -->
  <section id="about" class="reveal">
    <h2>About Me</h2>
    <p>배움을 실천하는 개발자입니다.</p>
  </section>

  <!-- 3. Skills 섹션: 기술 스택 -->
  <section id="skills" class="reveal">
    <h2>Skills</h2>
    <p>HTML, CSS, JavaScript</p>
  </section>

  <!-- 4. Projects 섹션: 프로젝트 목록 (추후 GitHub 연동 자리) -->
  <section id="projects" class="reveal">
    <h2>Projects</h2>
    <p>깃허브 저장소 목록이 들어올 자리입니다.</p>
  </section>

  <!-- 5. Contact 섹션: 문의 양식 -->
  <section id="contact" class="reveal">
    <h2>Contact</h2>
    <p>문의사항이 있다면 메시지를 남겨주세요.</p>
  </section>

  <!-- 6. Footer 섹션: 바닥글 -->
  <footer>
    <p>© 2026 내 이름. All rights reserved.</p>
  </footer>

  <script>
    const menuBtn = document.getElementById("menu-btn");
    const links = document.getElementById("menu-links");
    menuBtn.addEventListener("click", function () {
      links.classList.toggle("open");
    });

    const targets = document.querySelectorAll(".reveal");
    const observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
        }
      });
    });
    targets.forEach(function (el) {
      observer.observe(el);
    });
  </script>
</body>
</html>
