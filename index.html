<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 포트폴리오</title>
<style>
    /* 기본 리셋: 여백 제거 및 박스 크기 기준 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      line-height: 1.6;
    }
    /* 6개 섹션이 눈에 잘 보이도록 색상과 여백 부여 */
    header, section, footer {
      padding: 60px 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    #hero { background-color: #f0f4f8; }
    #about { background-color: #ffffff; }
    #skills { background-color: #f9f9f9; }
    #projects { background-color: #ffffff; }
    #contact { background-color: #f0f4f8; }
    footer { background-color: #333333; color: #ffffff; }
  </style>
</head>
<body>

  <!-- 1. Hero 섹션: 사이트의 첫인상 -->
  <header id="hero">
    <h1>안녕하세요, 웹 개발자 포트폴리오입니다</h1>
    <p>저의 웹 공간에 오신 것을 환영합니다.</p>
  </header>

  <!-- 2. About 섹션: 자기소개 -->
  <section id="about">
    <h2>About Me</h2>
    <p>배움을 실천하는 개발자입니다.</p>
  </section>

  <!-- 3. Skills 섹션: 기술 스택 -->
  <section id="skills">
    <h2>Skills</h2>
    <p>HTML, CSS, JavaScript</p>
  </section>

  <!-- 4. Projects 섹션: 프로젝트 목록 (추후 GitHub 연동 자리) -->
  <section id="projects">
    <h2>Projects</h2>
    <p>깃허브 저장소 목록이 들어올 자리입니다.</p>
  </section>

  <!-- 5. Contact 섹션: 문의 양식 -->
  <section id="contact">
    <h2>Contact</h2>
    <p>문의사항이 있다면 메시지를 남겨주세요.</p>
  </section>

  <!-- 6. Footer 섹션: 바닥글 -->
  <footer>
    <p>© 2026 내 이름. All rights reserved.</p>
  </footer>

</body>
</html>
